# Builds the fork's pcbnew on Linux x86_64 in the ai-pns/ci Debian 13 image, packs a relocatable
# tarball, smoke-tests it (headless pcbnew + IPC API) in clean Debian 13 and Ubuntu 24.04 containers
# and publishes it: as a workflow artifact on every run, as a GitHub Release asset for tags v*.
name: Build binaries

on:
  push:
    branches: [api-pns-router]
    tags: ['v*']
    paths-ignore: ['ai-pns/README.md', 'ai-pns/docs/**']
  pull_request:
    branches: [api-pns-router]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      name: ${{ steps.name.outputs.name }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune -af > /dev/null
          df -h /

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Package name
        id: name
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v=${GITHUB_REF_NAME}; else v=g$(git rev-parse --short=10 HEAD); fi
          echo "name=kicad-pns-$v-linux-x86_64" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t kpns-ci ai-pns/ci

      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-linux-x86_64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-linux-x86_64-

      - name: Build
        # leaves time to save the cache even when the first (cold) build does not finish
        timeout-minutes: 300
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" -e JOBS="$(nproc)" \
            -e CCACHE_DIR="$PWD/.ccache" kpns-ci ai-pns/ci/build.sh

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-linux-x86_64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" kpns-ci \
            ai-pns/ci/package.sh dist "${{ steps.name.outputs.name }}"
          rm -rf build
          ls -l dist

      - name: Smoke test in a clean Debian 13 container
        run: ai-pns/ci/test-clean.sh debian:13-slim "dist/${{ steps.name.outputs.name }}.tar.xz"

      - name: Smoke test in a clean Ubuntu 24.04 container
        run: ai-pns/ci/test-clean.sh ubuntu:24.04 "dist/${{ steps.name.outputs.name }}.tar.xz"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            dist/*.tar.xz
            dist/*.sha256
          compression-level: 0
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: linux-x86_64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.linux-x86_64.outputs.name }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag \
                 --title "$GITHUB_REF_NAME" --notes "Linux x86_64 build of the PNS router API fork. See ai-pns/README.md, section Installing a release build."
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber dist/*
