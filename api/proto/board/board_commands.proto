//// Interactive commands ////
// These commands begin an interactive operation in the editor.
// They return a response immediately, but the editor will become busy
// and will not reply to further API commands until the user has finished
// the operation.
// These commands will return an error if received in a non-interactive context.

// Selects and begins an interactive move of the given item(s).
// NOTE: Takes ownership of the active commit, if one exists:
//       the move tool will push the commit when the user confirms the move,
//       or roll back the commit if the user cancels the move.  Keep this in
//       mind if using this command in combination with commands that create
//       or modify items using an explicit commit.
message InteractiveMoveItems
{
  kiapi.common.types.DocumentSpecifier board = 1;

  repeated kiapi.common.types.KIID items = 2;
}


//// Push & shove router commands ////
// These drive KiCad's interactive router (PNS) programmatically: the same code path as routing
// or dragging with the mouse, but the points come from the request instead of mouse events.
// They run synchronously and return when the operation has been committed (one undo step).
// They require a board editor frame (not available in headless sessions).

enum RouterMode
{
  RTM_UNKNOWN          = 0;   // use the editor's current router mode
  RTM_SHOVE            = 1;   // push other tracks/vias out of the way
  RTM_WALKAROUND       = 2;   // go around obstacles, never move other items
  RTM_MARK_OBSTACLES   = 3;   // highlight collisions (only commits if the board allows DRC violations)
}

// Route a single track like the interactive router: start at `start` on `layer` (a pad, track end
// or via there becomes the start item and sets the net), then each point in `points` acts like a
// left click.  If a point lands on an item of the same net the route completes there.
// Routes one track with the interactive router (like clicking with the mouse).  Each point is a
// click; intermediate points are plain corners, the last one may land on an item of the net.
// All or nothing: if a leg cannot be fixed at its point, nothing is committed (success = false).
// Commits as one undo step and cannot run inside an open commit.  No vias or layer changes.
message RouteTrack
{
  kiapi.common.types.DocumentSpecifier board = 1;
  kiapi.common.types.Vector2 start = 2;
  kiapi.board.types.BoardLayer layer = 3;
  repeated kiapi.common.types.Vector2 points = 4;
  RouterMode mode = 5;
  // Track width; if absent, the width comes from the design rules / net class like in the editor
  optional kiapi.common.types.Distance width = 6;
  // Finish at the last point even when it does not end on an item (like a double click)
  bool finish_at_last_point = 7;
  // Allow any-angle routing instead of 45-degree posture
  bool free_angle = 8;
  // Route a differential pair (start on either net of the pair); width applies to each track
  bool diff_pair = 9;
  // Gap between the tracks of the pair; if absent, from the design rules like in the editor
  optional kiapi.common.types.Distance diff_pair_gap = 10;
  // Corner style; RCM_UNKNOWN keeps the editor's setting
  RouterCornerMode corner_mode = 11;
  // Empty, or the layer of each point (same length as points).  When the layer changes a
  // through via is placed at the previous point and the route continues on the new layer.
  repeated kiapi.board.types.BoardLayer point_layers = 12;
  // Via size for layer changes; if absent, from the design rules / current via size
  optional kiapi.common.types.Distance via_diameter = 13;
  optional kiapi.common.types.Distance via_drill = 14;
}

enum RouterCornerMode
{
  RCM_UNKNOWN     = 0;
  RCM_MITERED_45  = 1;
  RCM_ROUNDED_45  = 2;
  RCM_MITERED_90  = 3;
  RCM_ROUNDED_90  = 4;
}

message RouteTrackResponse
{
  // Every point was reached and the route was committed
  bool success = 1;
  // The route reached an item of the same net (completed connection)
  bool completed = 2;
  // Router failure reason, if any
  string message = 3;
  // End point the router actually reached
  kiapi.common.types.Vector2 end = 4;
  // Tracks, arcs and vias added / removed by the route (removed: replaced or loop-removed copper)
  repeated kiapi.common.types.KIID created_items = 5;
  repeated kiapi.common.types.KIID removed_items = 6;
}

// Drag a track segment, arc or via like the interactive "Drag (45 degree)" tool: grab the item at
// `grab` on `layer` and move that grab point to `target`, shoving neighbours as the mode allows.
// Drags the track, arc or via under the grab point to the target, like the interactive drag tool
// (shoving neighbours in shove mode).  Locked items are refused.  Never force-commits.
message DragTrack
{
  kiapi.common.types.DocumentSpecifier board = 1;
  kiapi.common.types.Vector2 grab = 2;
  kiapi.board.types.BoardLayer layer = 3;
  kiapi.common.types.Vector2 target = 4;
  RouterMode mode = 5;
  bool free_angle = 6;
}

message DragTrackResponse
{
  // The grab point reached the target and the drag was committed
  bool success = 1;
  string message = 2;
  // Where the grab point ended up (the grab point itself if nothing was committed)
  kiapi.common.types.Vector2 end = 3;
  repeated kiapi.common.types.KIID created_items = 4;
  repeated kiapi.common.types.KIID removed_items = 5;
}

// Runs the board editor's "Cleanup Tracks & Vias" on the whole board or on the given nets.
// One undo step.  Cannot run inside an open commit.
message CleanupTracks
{
  kiapi.common.types.DocumentSpecifier board = 1;
  // Restrict to these nets (empty = all nets)
  repeated string nets = 2;
  // Merge collinear segments and delete zero-length ones
  bool merge_segments = 3;
  // Delete tracks connected at one end only
  bool delete_dangling_tracks = 4;
  // Delete tracks fully inside pads
  bool delete_tracks_in_pads = 5;
  // Delete segments that short two nets
  bool delete_shorting_tracks = 6;
  // Delete redundant (superimposed) vias
  bool delete_redundant_vias = 7;
  // Delete vias connected on a single layer only
  bool delete_dangling_vias = 8;
  // Only report what would change
  bool dry_run = 9;
}

// Runs the design rule checker on the open board and returns the violations (no markers are
// added, no report files are written).  Schematic parity is not checked.
message RunDrc
{
  kiapi.common.types.DocumentSpecifier board = 1;
  // Refill all zones first (like the DRC dialog's option)
  bool refill_zones = 2;
  // Report all errors of each track instead of the first one
  bool report_all_track_errors = 3;
  // Only return violations that involve an item of one of these nets (empty = all)
  repeated string nets = 4;
}

message DrcViolation
{
  // Settings key of the check, e.g. "clearance", "unconnected_items", "tracks_crossing"
  string type = 1;
  DrcSeverity severity = 2;
  string description = 3;
  kiapi.common.types.Vector2 position = 4;
  kiapi.board.types.BoardLayer layer = 5;
  repeated kiapi.common.types.KIID items = 6;
  repeated string item_descriptions = 7;
  // Rule that produced the violation, if any
  string rule = 8;
}

message RunDrcResponse
{
  repeated DrcViolation violations = 1;
}

message CleanupTracksResponse
{
  // One line per change (cleanup item description with position)
  repeated string changes = 1;
}
